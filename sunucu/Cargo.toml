[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/db",
    "crates/engine",
    "crates/engine-client",
    "crates/engine-service",
    "crates/api",
    "crates/worker",
    "crates/events",
    "crates/ingest",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
# Internal crates
common = { path = "crates/common" }
db = { path = "crates/db" }
events = { path = "crates/events" }
engine = { path = "crates/engine" }
storage = { path = "crates/storage" }

# Shared third-party crates
async-nats = "0.52.0"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3.32"
http-body-util = "0.1.5"
prost = "0.14.5"
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
sha2 = "0.11.1"
serde_json_canonicalizer = "0.4.1"
protox = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
rust_decimal = "1.43.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-prost = "0.14.9"
tonic-types = "0.14.9"
tonic-prost-build = "0.14.9"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
