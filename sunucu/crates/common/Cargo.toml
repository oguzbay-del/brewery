[package]
name = "common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Shared HTTP helpers (health endpoint, graceful shutdown) for axum services.
http = ["dep:axum"]
# OpenTelemetry traces (OTLP export when OTEL_EXPORTER_OTLP_ENDPOINT is set).
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
axum = { workspace = true, optional = true }
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry_sdk = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", optional = true, default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = { version = "0.34.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
engine.workspace = true
tower.workspace = true

[lints]
workspace = true
