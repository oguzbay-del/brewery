# XcodeGen spec (ADR-0001). Generate the project with: xcodegen generate
# The .xcodeproj is not committed and not edited by hand.
name: Demleme
options:
  bundleIdPrefix: app.demleme # placeholder, to be changed
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is intentionally empty: CI and the product owner set it.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
targets:
  Demleme:
    type: application
    platform: iOS
    sources:
      - path: Demleme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.demleme.Demleme
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: tint
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Demleme
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  DemlemeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DemlemeTests
    dependencies:
      - target: Demleme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.demleme.DemlemeTests
        GENERATE_INFOPLIST_FILE: YES
  DemlemeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DemlemeUITests
    dependencies:
      - target: Demleme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.demleme.DemlemeUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Demleme:
    build:
      targets:
        Demleme: all
    test:
      targets:
        - DemlemeTests
        - DemlemeUITests
