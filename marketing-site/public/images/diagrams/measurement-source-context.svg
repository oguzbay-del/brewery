<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Measurement source and context</title><desc id="desc">Three conceptual measurement origins—manual observation, instrument reading, and connected device—each accompanied by time, unit, method, and calibration context.</desc><rect width="960" height="520" rx="24" fill="#f7f5f0"/><text x="56" y="62" fill="#29251f" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">MEASUREMENT · SOURCE MATTERS</text><text x="56" y="112" fill="#29251f" font-family="Arial,sans-serif" font-size="25" font-weight="700">A reading needs its context</text><g font-family="Arial,sans-serif"><g><rect x="56" y="155" width="260" height="170" rx="14" fill="#fff" stroke="#d9cbb7" stroke-width="2"/><circle cx="100" cy="202" r="22" fill="#f0e4cf"/><path d="M90 202l8 8 14-17" fill="none" stroke="#6c4a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="208" fill="#29251f" font-size="20" font-weight="700">Manual note</text><text x="82" y="256" fill="#665f55" font-size="15">Entered by a brewer</text><text x="82" y="284" fill="#665f55" font-size="13">Human observation</text></g><g><rect x="350" y="155" width="260" height="170" rx="14" fill="#fff" stroke="#d9cbb7" stroke-width="2"/><circle cx="394" cy="202" r="22" fill="#f0e4cf"/><path d="M394 186v17l12 7" fill="none" stroke="#6c4a22" stroke-width="4" stroke-linecap="round"/><text x="430" y="208" fill="#29251f" font-size="20" font-weight="700">Instrument</text><text x="376" y="256" fill="#665f55" font-size="15">Measured with a tool</text><text x="376" y="284" fill="#665f55" font-size="13">Method and calibration</text></g><g><rect x="644" y="155" width="260" height="170" rx="14" fill="#fff" stroke="#d9cbb7" stroke-width="2"/><circle cx="688" cy="202" r="22" fill="#f0e4cf"/><path d="M678 202h20m-10-10v20" fill="none" stroke="#6c4a22" stroke-width="4" stroke-linecap="round"/><text x="724" y="208" fill="#29251f" font-size="20" font-weight="700">Device reading</text><text x="670" y="256" fill="#665f55" font-size="15">Received from a device</text><text x="670" y="284" fill="#665f55" font-size="13">Device and connection</text></g><path d="M186 325V365H774V325M480 365V390" fill="none" stroke="#b8873d" stroke-width="3"/><rect x="150" y="390" width="660" height="75" rx="12" fill="#29251f"/><text x="480" y="420" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Shared context to preserve</text><text x="480" y="445" fill="#f3e8d6" font-size="15" text-anchor="middle">Timestamp · unit · method · source · calibration status (where relevant)</text><text x="480" y="495" fill="#665f55" font-size="13" text-anchor="middle">Conceptual data principle · not a statement of current product functionality</text></g></svg>