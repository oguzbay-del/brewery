<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Equipment calibration record</title><desc id="desc">A record structure linking an instrument to a reference standard, observed test reading, tolerance review and a recorded status.</desc><rect width="1100" height="520" rx="24" fill="#f7f5f0"/><text x="56" y="58" fill="#29251f" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">TECHNICAL PRINCIPLES · RECORD MODEL</text><text x="56" y="105" fill="#29251f" font-family="Arial,sans-serif" font-size="28" font-weight="700">A calibration record should show what was checked and how</text><g font-family="Arial,sans-serif"><g transform="translate(56 160)"><rect width="180" height="150" rx="14" fill="#fff" stroke="#c8bda9" stroke-width="2"/><circle cx="90" cy="38" r="18" fill="#e9d6b9"/><path d="M90 26v24m-10-12h20" stroke="#6c4a22" stroke-width="3" stroke-linecap="round"/><text x="90" y="83" text-anchor="middle" fill="#29251f" font-size="17" font-weight="700">Instrument</text><text x="90" y="110" text-anchor="middle" fill="#665f55" font-size="13">ID · type · range</text><text x="90" y="131" text-anchor="middle" fill="#665f55" font-size="12">e.g. hydrometer</text></g><path d="M238 235H266" stroke="#b8873d" stroke-width="4"/><path d="M258 227l9 8-9 8" fill="none" stroke="#b8873d" stroke-width="3"/><g transform="translate(270 160)"><rect width="180" height="150" rx="14" fill="#fff" stroke="#c8bda9" stroke-width="2"/><circle cx="90" cy="38" r="18" fill="#e9d6b9"/><path d="M78 42h24M82 31h16M86 24v34" stroke="#6c4a22" stroke-width="3" stroke-linecap="round"/><text x="90" y="83" text-anchor="middle" fill="#29251f" font-size="17" font-weight="700">Reference</text><text x="90" y="110" text-anchor="middle" fill="#665f55" font-size="13">standard · method</text><text x="90" y="131" text-anchor="middle" fill="#665f55" font-size="12">traceable source</text></g><path d="M452 235H480" stroke="#b8873d" stroke-width="4"/><path d="M472 227l9 8-9 8" fill="none" stroke="#b8873d" stroke-width="3"/><g transform="translate(484 160)"><rect width="180" height="150" rx="14" fill="#fff" stroke="#c8bda9" stroke-width="2"/><circle cx="90" cy="38" r="18" fill="#e9d6b9"/><path d="M90 22v30m-10-10h20" stroke="#6c4a22" stroke-width="3" stroke-linecap="round"/><text x="90" y="83" text-anchor="middle" fill="#29251f" font-size="17" font-weight="700">Test reading</text><text x="90" y="110" text-anchor="middle" fill="#665f55" font-size="13">observed value</text><text x="90" y="131" text-anchor="middle" fill="#665f55" font-size="12">unit · timestamp</text></g><path d="M666 235H694" stroke="#b8873d" stroke-width="4"/><path d="M686 227l9 8-9 8" fill="none" stroke="#b8873d" stroke-width="3"/><g transform="translate(698 160)"><rect width="150" height="150" rx="14" fill="#fff" stroke="#c8bda9" stroke-width="2"/><circle cx="75" cy="38" r="18" fill="#e9d6b9"/><path d="M64 39l8 8 16-18" fill="none" stroke="#6c4a22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="83" text-anchor="middle" fill="#29251f" font-size="17" font-weight="700">Tolerance</text><text x="75" y="110" text-anchor="middle" fill="#665f55" font-size="13">reviewed</text><text x="75" y="131" text-anchor="middle" fill="#665f55" font-size="12">criteria applied</text></g><path d="M850 235H878" stroke="#b8873d" stroke-width="4"/><path d="M870 227l9 8-9 8" fill="none" stroke="#b8873d" stroke-width="3"/><g transform="translate(882 160)"><rect width="162" height="150" rx="14" fill="#29251f"/><circle cx="81" cy="38" r="18" fill="#d97706"/><path d="M72 38h18" stroke="#29251f" stroke-width="3" stroke-linecap="round"/><text x="81" y="83" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Record status</text><text x="81" y="110" text-anchor="middle" fill="#f2e9dc" font-size="13">result · reviewer</text><text x="81" y="131" text-anchor="middle" fill="#f2e9dc" font-size="12">next check date</text></g></g><rect x="56" y="370" width="988" height="88" rx="12" fill="#eee4d5"/><text x="80" y="405" fill="#29251f" font-family="Arial,sans-serif" font-size="16" font-weight="700">Record fields</text><text x="80" y="434" fill="#665f55" font-family="Arial,sans-serif" font-size="14">Instrument ID · reference ID · observed value and unit · tolerance · checked at · reviewed by · status</text></svg>