<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Fermentation observation timeline</title><desc id="desc">A six-point timeline with example values showing gravity, temperature and a short note at each observation, with manual sample context and timestamps.</desc><rect width="1100" height="500" rx="24" fill="#f7f5f0"/><text x="56" y="58" fill="#29251f" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">HOMEBREWING · FERMENTATION RECORD</text><text x="56" y="104" fill="#29251f" font-family="Arial,sans-serif" font-size="28" font-weight="700">Observations become useful when time and source stay attached</text><text x="56" y="140" fill="#665f55" font-family="Arial,sans-serif" font-size="15">EXAMPLE DATA</text><path d="M110 235H990" stroke="#c9b99f" stroke-width="4"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(110 235)"><circle r="13" fill="#d97706" stroke="#fff" stroke-width="4"/><text y="-35" fill="#29251f" font-size="17" font-weight="700">Day 0</text><text y="56" fill="#29251f" font-size="17" font-weight="700">1.052 SG</text><text y="82" fill="#665f55" font-size="14">19.0 °C</text><text y="112" fill="#665f55" font-size="12">Pitch</text></g><g transform="translate(286 235)"><circle r="13" fill="#d97706" stroke="#fff" stroke-width="4"/><text y="-35" fill="#29251f" font-size="17" font-weight="700">Day 2</text><text y="56" fill="#29251f" font-size="17" font-weight="700">1.038 SG</text><text y="82" fill="#665f55" font-size="14">19.2 °C</text><text y="112" fill="#665f55" font-size="12">Active</text></g><g transform="translate(462 235)"><circle r="13" fill="#d97706" stroke="#fff" stroke-width="4"/><text y="-35" fill="#29251f" font-size="17" font-weight="700">Day 4</text><text y="56" fill="#29251f" font-size="17" font-weight="700">1.022 SG</text><text y="82" fill="#665f55" font-size="14">19.5 °C</text><text y="112" fill="#665f55" font-size="12">Sample</text></g><g transform="translate(638 235)"><circle r="13" fill="#d97706" stroke="#fff" stroke-width="4"/><text y="-35" fill="#29251f" font-size="17" font-weight="700">Day 6</text><text y="56" fill="#29251f" font-size="17" font-weight="700">1.014 SG</text><text y="82" fill="#665f55" font-size="14">19.3 °C</text><text y="112" fill="#665f55" font-size="12">Sample</text></g><g transform="translate(814 235)"><circle r="13" fill="#d97706" stroke="#fff" stroke-width="4"/><text y="-35" fill="#29251f" font-size="17" font-weight="700">Day 8</text><text y="56" fill="#29251f" font-size="17" font-weight="700">1.012 SG</text><text y="82" fill="#665f55" font-size="14">19.0 °C</text><text y="112" fill="#665f55" font-size="12">Check</text></g><g transform="translate(990 235)"><circle r="13" fill="#29251f" stroke="#fff" stroke-width="4"/><text y="-35" fill="#29251f" font-size="17" font-weight="700">Day 12</text><text y="56" fill="#29251f" font-size="17" font-weight="700">1.012 SG</text><text y="82" fill="#665f55" font-size="14">18.8 °C</text><text y="112" fill="#665f55" font-size="12">Review</text></g></g><rect x="56" y="405" width="988" height="52" rx="10" fill="#eee4d5"/><text x="550" y="437" text-anchor="middle" fill="#665f55" font-family="Arial,sans-serif" font-size="15">A useful observation keeps its timestamp, unit, measurement source and note together</text></svg>