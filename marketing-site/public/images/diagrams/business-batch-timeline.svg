<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Professional brewery batch timeline</title><desc id="desc">A sequence linking a recipe version, planned batch, recorded production, vessel observations and quality review.</desc><rect width="960" height="500" rx="24" fill="#f7f5f0"/><text x="56" y="60" fill="#29251f" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">PROFESSIONAL BREWERIES · BATCH CONTEXT</text><text x="56" y="108" fill="#29251f" font-family="Arial,sans-serif" font-size="26" font-weight="700">A batch gathers context across the production cycle</text><path d="M120 245H840" stroke="#b8873d" stroke-width="4"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(120 245)"><circle r="31" fill="#29251f"/><text y="8" fill="#fff" font-size="19" font-weight="700">01</text><text y="76" fill="#29251f" font-size="17" font-weight="700">Recipe version</text><text y="101" fill="#665f55" font-size="13">Targets and definition</text></g><g transform="translate(300 245)"><circle r="31" fill="#d97706"/><text y="8" fill="#fff" font-size="19" font-weight="700">02</text><text y="76" fill="#29251f" font-size="17" font-weight="700">Batch plan</text><text y="101" fill="#665f55" font-size="13">Scheduled work</text></g><g transform="translate(480 245)"><circle r="31" fill="#d97706"/><text y="8" fill="#fff" font-size="19" font-weight="700">03</text><text y="76" fill="#29251f" font-size="17" font-weight="700">Production record</text><text y="101" fill="#665f55" font-size="13">Actuals and notes</text></g><g transform="translate(660 245)"><circle r="31" fill="#d97706"/><text y="8" fill="#fff" font-size="19" font-weight="700">04</text><text y="76" fill="#29251f" font-size="17" font-weight="700">Vessel events</text><text y="101" fill="#665f55" font-size="13">Transfers and readings</text></g><g transform="translate(840 245)"><circle r="31" fill="#29251f"/><text y="8" fill="#fff" font-size="19" font-weight="700">05</text><text y="76" fill="#29251f" font-size="17" font-weight="700">Quality review</text><text y="101" fill="#665f55" font-size="13">Results and decision</text></g></g><rect x="120" y="400" width="720" height="48" rx="10" fill="#eee4d5"/><text x="480" y="430" fill="#665f55" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Business batch timeline</text></svg>