<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Homebrew ingredient context</title><desc id="desc">A conceptual four-step path from recipe ingredient specification to selected inputs, brew-day quantities, and batch review.</desc><rect width="960" height="460" rx="24" fill="#f7f5f0"/><text x="56" y="60" fill="#29251f" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">HOMEBREWING · INGREDIENT CONTEXT</text><text x="56" y="108" fill="#29251f" font-family="Arial,sans-serif" font-size="26" font-weight="700">From recipe choice to what went into the brew</text><path d="M180 230H780" stroke="#c7bba8" stroke-width="4" stroke-dasharray="8 9"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(180 230)"><circle r="62" fill="#f0e4cf" stroke="#c58b36" stroke-width="2"/><path d="M-24-18h48l-5 42h-38z" fill="none" stroke="#6c4a22" stroke-width="4"/><text y="92" fill="#29251f" font-size="18" font-weight="700">Recipe</text><text y="116" fill="#665f55" font-size="13">Specify ingredients</text></g><g transform="translate(380 230)"><circle r="62" fill="#ead7b9" stroke="#c58b36" stroke-width="2"/><path d="M-25 5q25-48 50 0q-25 42-50 0z" fill="none" stroke="#6c4a22" stroke-width="4"/><text y="92" fill="#29251f" font-size="18" font-weight="700">Selected inputs</text><text y="116" fill="#665f55" font-size="13">Malt · hops · yeast · water</text></g><g transform="translate(580 230)"><circle r="62" fill="#e5d5bf" stroke="#c58b36" stroke-width="2"/><path d="M-24-18h48v40h-48z M-14-29v11m28-11v11" fill="none" stroke="#6c4a22" stroke-width="4"/><text y="92" fill="#29251f" font-size="18" font-weight="700">Brew-day actuals</text><text y="116" fill="#665f55" font-size="13">Record quantities used</text></g><g transform="translate(780 230)"><circle r="62" fill="#f0e4cf" stroke="#c58b36" stroke-width="2"/><path d="M-24 14l17-20 14 11 26-34" fill="none" stroke="#6c4a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text y="92" fill="#29251f" font-size="18" font-weight="700">Batch review</text><text y="116" fill="#665f55" font-size="13">Compare plan and result</text></g></g><text x="480" y="420" fill="#665f55" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Conceptual learning aid · not a live product workflow</text></svg>