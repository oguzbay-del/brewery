<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Illustrative fermentation gravity profile</title><desc id="desc">A simulated example curve showing gravity decreasing over time. It is illustrative data, not a product output or brewing recommendation.</desc><rect width="960" height="520" rx="24" fill="#f7f5f0"/><text x="56" y="62" fill="#29251f" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">ILLUSTRATIVE DATA · NOT A PRODUCT OUTPUT</text><text x="90" y="112" fill="#29251f" font-family="Arial,sans-serif" font-size="25" font-weight="700">Example fermentation profile</text><g stroke="#ded5c8" stroke-width="1"><path d="M110 160H875M110 230H875M110 300H875M110 370H875M110 440H875"/></g><g stroke="#8b8173" stroke-width="2"><path d="M110 150V440H875"/></g><path d="M110 185C180 195 215 215 280 250S390 315 470 350S620 390 720 405S820 410 875 412" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><path d="M110 185C180 195 215 215 280 250S390 315 470 350S620 390 720 405S820 410 875 412V440H110Z" fill="#d97706" opacity=".10"/><g fill="#665f55" font-family="Arial,sans-serif" font-size="14"><text x="110" y="470" text-anchor="middle">Day 0</text><text x="300" y="470" text-anchor="middle">Day 3</text><text x="490" y="470" text-anchor="middle">Day 6</text><text x="680" y="470" text-anchor="middle">Day 9</text><text x="875" y="470" text-anchor="middle">Day 12</text><text x="90" y="190" text-anchor="end">1.060</text><text x="90" y="260" text-anchor="end">1.045</text><text x="90" y="330" text-anchor="end">1.030</text><text x="90" y="400" text-anchor="end">1.015</text><text x="90" y="445" text-anchor="end">1.005</text><text x="495" y="505" text-anchor="middle">Elapsed time · illustrative values</text><text x="135" y="145">Specific gravity (SG)</text></g></svg>