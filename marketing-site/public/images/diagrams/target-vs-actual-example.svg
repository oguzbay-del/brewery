<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Illustrative target versus actual brewing measurements</title><desc id="desc">A conceptual chart contrasting a planned target line with separate simulated actual measurement points. It is not a Demleme product output.</desc><rect width="960" height="520" rx="24" fill="#f7f5f0"/><text x="56" y="62" fill="#29251f" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">BREWING DATA · TARGET VS ACTUAL</text><text x="90" y="112" fill="#29251f" font-family="Arial,sans-serif" font-size="25" font-weight="700">Keep the plan separate from the measurement</text><g stroke="#ded5c8" stroke-width="1"><path d="M120 175H870M120 250H870M120 325H870M120 400H870"/></g><path d="M120 160V430H870" fill="none" stroke="#8b8173" stroke-width="2"/><path d="M120 255H870" fill="none" stroke="#29251f" stroke-width="4" stroke-dasharray="10 9"/><path d="M120 300L270 284L420 315L570 278L720 292L870 265" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g fill="#d97706" stroke="#fff" stroke-width="3"><circle cx="120" cy="300" r="9"/><circle cx="270" cy="284" r="9"/><circle cx="420" cy="315" r="9"/><circle cx="570" cy="278" r="9"/><circle cx="720" cy="292" r="9"/><circle cx="870" cy="265" r="9"/></g><g font-family="Arial,sans-serif" font-size="15"><path d="M150 465H205" stroke="#29251f" stroke-width="4" stroke-dasharray="9 7"/><text x="218" y="470" fill="#29251f">Planned target (illustrative)</text><path d="M500 465H555" stroke="#d97706" stroke-width="4"/><circle cx="528" cy="465" r="6" fill="#d97706"/><text x="568" y="470" fill="#29251f">Actual observations (simulated)</text><text x="495" y="505" fill="#665f55" text-anchor="middle" font-size="13">Conceptual example · no real batch data or product output</text></g></svg>