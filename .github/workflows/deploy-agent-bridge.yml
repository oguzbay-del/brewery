name: Deploy GRISTORA Agent Bridge

on:
  push:
    branches:
      - main
    paths:
      - "agent-bridge/**"
      - ".github/workflows/deploy-agent-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gristora-agent-bridge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-bridge
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-bridge/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Type-check Worker
        run: npm run check
      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: agent-bridge
          command: deploy
