name: Agent config check

# Reports which agent settings exist (true/false only, never values) and, when the bridge
# is configured, runs the live acceptance check against the deployed Worker.
# Missing settings do not fail this workflow; a failed live check does.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  pull_request:
    paths:
      - "agent-bridge/**"
      - ".github/workflows/agent-*.yml"
      - ".github/scripts/agent-*.mjs"

permissions:
  contents: read

jobs:
  config:
    name: agent configuration and live bridge check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report configuration (presence only)
        id: cfg
        env:
          S_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          S_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          S_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          S_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          S_AGENT_GH: ${{ secrets.AGENT_GITHUB_TOKEN != '' }}
          S_TOKEN_CLAUDE: ${{ secrets.MCP_TOKEN_CLAUDE != '' }}
          S_TOKEN_GPT: ${{ secrets.MCP_TOKEN_GPT != '' }}
          V_URL: ${{ vars.AGENT_BRIDGE_URL != '' }}
          V_MODEL: ${{ vars.OPENAI_MODEL != '' }}
        run: |
          {
            echo "## Agent configuration"
            echo ""
            echo "| Setting | Kind | Present |"
            echo "|---|---|---|"
            echo "| CLOUDFLARE_API_TOKEN | secret | $S_CF_TOKEN |"
            echo "| CLOUDFLARE_ACCOUNT_ID | secret | $S_CF_ACCOUNT |"
            echo "| ANTHROPIC_API_KEY | secret | $S_ANTHROPIC |"
            echo "| OPENAI_API_KEY | secret | $S_OPENAI |"
            echo "| AGENT_GITHUB_TOKEN | secret | $S_AGENT_GH |"
            echo "| MCP_TOKEN_CLAUDE | secret | $S_TOKEN_CLAUDE |"
            echo "| MCP_TOKEN_GPT | secret | $S_TOKEN_GPT |"
            echo "| AGENT_BRIDGE_URL | variable | $V_URL |"
            echo "| OPENAI_MODEL | variable | $V_MODEL |"
          } >> "$GITHUB_STEP_SUMMARY"
          ready=false
          if [ "$V_URL" = true ] && [ "$S_TOKEN_CLAUDE" = true ] && [ "$S_TOKEN_GPT" = true ]; then ready=true; fi
          echo "live=$ready" >> "$GITHUB_OUTPUT"
          [ "$ready" = true ] || echo "::notice::NOT CONFIGURED: the live bridge check needs AGENT_BRIDGE_URL, MCP_TOKEN_CLAUDE and MCP_TOKEN_GPT."
      - name: Check out runner code
        if: steps.cfg.outputs.live == 'true'
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            agent-bridge
            .github/scripts
          persist-credentials: false
      - name: Set up Node.js
        if: steps.cfg.outputs.live == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Live acceptance check (Claude and GPT identities)
        if: steps.cfg.outputs.live == 'true'
        working-directory: agent-bridge
        env:
          AGENT_BRIDGE_URL: ${{ vars.AGENT_BRIDGE_URL }}
          MCP_TOKEN_CLAUDE: ${{ secrets.MCP_TOKEN_CLAUDE }}
          MCP_TOKEN_GPT: ${{ secrets.MCP_TOKEN_GPT }}
        run: |
          npm ci
          node runner/live-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
