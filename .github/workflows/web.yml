name: web

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "web/**"
      - "tasarim-sistemi/tokens.json"
      - "sozlesme/istemci/typescript/src/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "tasarim-sistemi/tokens.json"
      - "sozlesme/istemci/typescript/src/**"
      - ".github/workflows/web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:tokens
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E
        # An empty PW_CHROMIUM_PATH makes playwright.config.ts pass an empty executablePath,
        # which Playwright treats as unset, so it uses the browser installed above.
        env:
          PW_CHROMIUM_PATH: ""
        run: npm run e2e -- --trace off
