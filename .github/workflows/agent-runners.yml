name: Agent runners

# Claude (implementation) and GPT (review, architecture, test design) take tasks from
# the agent bridge. One task per run and agent; one run per agent at a time.

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      agent:
        description: Which runner to start
        type: choice
        options: [both, claude, gpt]
        default: both

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      claude: ${{ steps.c.outputs.claude }}
      gpt: ${{ steps.c.outputs.gpt }}
    steps:
      - id: c
        env:
          URL: ${{ vars.AGENT_BRIDGE_URL }}
          MODEL: ${{ vars.OPENAI_MODEL }}
          A: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          O: ${{ secrets.OPENAI_API_KEY != '' }}
          GH: ${{ secrets.AGENT_GITHUB_TOKEN != '' }}
          TC: ${{ secrets.MCP_TOKEN_CLAUDE != '' }}
          TG: ${{ secrets.MCP_TOKEN_GPT != '' }}
          WANT: ${{ inputs.agent || 'both' }}
          EVENT: ${{ github.event_name }}
        run: |
          claude=false; gpt=false
          if [ -n "$URL" ] && [ "$A" = true ] && [ "$GH" = true ] && [ "$TC" = true ]; then claude=true; fi
          if [ -n "$URL" ] && [ -n "$MODEL" ] && [ "$O" = true ] && [ "$TG" = true ]; then gpt=true; fi
          [ "$WANT" = gpt ] && claude=skip
          [ "$WANT" = claude ] && gpt=skip
          for a in claude gpt; do
            v=${!a}
            if [ "$v" = false ]; then
              msg="BLOCKED: the $a runner is not configured (see agent-bridge/README.md › Runners)."
              if [ "$EVENT" = workflow_dispatch ]; then echo "::error::$msg"; exit 1; else echo "::notice::$msg"; fi
            fi
          done
          echo "claude=$claude" >> "$GITHUB_OUTPUT"
          echo "gpt=$gpt" >> "$GITHUB_OUTPUT"

  claude:
    needs: config
    if: needs.config.outputs.claude == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-runner-claude
      cancel-in-progress: false
    steps:
      - name: Check out main (no stored credentials)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-bridge/package-lock.json
      - name: Install runner dependencies
        working-directory: agent-bridge
        run: npm ci
      - name: Take and implement one Claude task
        env:
          AGENT_BRIDGE_URL: ${{ vars.AGENT_BRIDGE_URL }}
          MCP_TOKEN_CLAUDE: ${{ secrets.MCP_TOKEN_CLAUDE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          AGENT_MAX_BUDGET_USD: ${{ vars.AGENT_TASK_BUDGET_USD || '10' }}
          AGENT_TIMEOUT_MINUTES: "45"
        run: node agent-bridge/runner/claude.mjs tasks

  gpt:
    needs: config
    if: needs.config.outputs.gpt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: agent-runner-gpt
      cancel-in-progress: false
    steps:
      - name: Check out main (runner code only)
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            agent-bridge
            .github/scripts
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-bridge/package-lock.json
      - name: Install runner dependencies
        working-directory: agent-bridge
        run: npm ci
      - name: Take and answer one GPT task
        env:
          AGENT_BRIDGE_URL: ${{ vars.AGENT_BRIDGE_URL }}
          MCP_TOKEN_GPT: ${{ secrets.MCP_TOKEN_GPT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node agent-bridge/runner/gpt.mjs tasks
