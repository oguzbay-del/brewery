name: altyapi

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "altyapi/**"
      - "sunucu/**"
      - "Makefile"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "altyapi/**"
      - "sunucu/**"
      - "Makefile"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt ve validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Terraform version
        id: tf
        run: echo "version=$(tr -d '[:space:]' < altyapi/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: altyapi/terraform
      - name: init -backend=false ve validate (her env)
        working-directory: altyapi/terraform
        run: |
          set -euo pipefail
          for d in envs/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

  compose:
    name: compose config ve duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f altyapi/compose/compose.yaml config --quiet
      - name: make up
        run: make up
      - name: make smoke
        run: make smoke
      - name: Günlükler (başarısızlıkta)
        if: failure()
        run: docker compose -f altyapi/compose/compose.yaml logs --no-color --tail=200
      - name: make down
        if: always()
        run: make down ARGS=-v

  actionlint:
    name: iş akışı denetimi (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: actionlint 1.7.12
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  kubernetes:
    name: kustomize ve kind duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: kind 0.33.0
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - name: kustomize (base ve bütün overlay'ler)
        run: |
          set -euo pipefail
          for d in altyapi/k8s/base altyapi/k8s/overlays/*/; do
            echo "::group::$d"
            kubectl kustomize "$d" > /dev/null
            echo "::endgroup::"
          done
      - name: make kind-up
        run: make kind-up
      - name: make kind-test
        run: make kind-test
      - name: Küme durumu (başarısızlıkta)
        if: failure()
        run: |
          kubectl --context kind-demleme -n demleme get pods,jobs -o wide || true
          kubectl --context kind-demleme -n demleme describe pods | tail -n 200 || true
      - name: make kind-down
        if: always()
        run: make kind-down
