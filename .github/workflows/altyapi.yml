name: altyapi

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "altyapi/**"
      - "sunucu/**"
      - "Makefile"
      - ".github/workflows/altyapi.yml"
  pull_request:
    paths:
      - "altyapi/**"
      - "sunucu/**"
      - "Makefile"
      - ".github/workflows/altyapi.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt ve validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Terraform version
        id: tf
        run: echo "version=$(tr -d '[:space:]' < altyapi/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: altyapi/terraform
      - name: init -backend=false ve validate (her env)
        working-directory: altyapi/terraform
        run: |
          set -euo pipefail
          for d in envs/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

  compose:
    name: compose config ve duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f altyapi/compose/compose.yaml config --quiet
      - name: make up
        run: make up
      - name: make smoke
        run: make smoke
      - name: make e2e
        run: make e2e
      - name: make seed (iki kez; ikinci çalıştırma da başarılı olmalı)
        run: make seed && make seed
      - name: Günlükler (başarısızlıkta)
        if: failure()
        run: docker compose -f altyapi/compose/compose.yaml logs --no-color --tail=200
      - name: make down
        if: always()
        run: make down ARGS=-v

  kubernetes:
    name: kustomize ve kind duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: kind 0.33.0
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - name: kustomize (base ve bütün overlay'ler)
        run: |
          set -euo pipefail
          for d in altyapi/k8s/base altyapi/k8s/overlays/*/; do
            echo "::group::$d"
            kubectl kustomize "$d" > /dev/null
            echo "::endgroup::"
          done
      - name: make kind-up
        run: make kind-up
      - name: make kind-test
        run: make kind-test
      - name: Küme durumu ve başarısız pod günlükleri (başarısızlıkta)
        if: failure()
        run: |
          set +e
          kubectl --context kind-demleme -n demleme get pods,jobs -o wide || true
          kubectl --context kind-demleme -n demleme describe pods || true
          kubectl --context kind-demleme -n demleme get pods -o json \
            | jq -r '.items[] | select(any(.status.containerStatuses[]?; .ready == false)) | .metadata.name' \
            | while read -r pod; do
                [ -n "$pod" ] || continue
                echo "::group::Önceki container günlükleri: $pod"
                kubectl --context kind-demleme -n demleme logs "$pod" --all-containers=true --previous --tail=150 || true
                echo "::endgroup::"
                echo "::group::Güncel container günlükleri: $pod"
                kubectl --context kind-demleme -n demleme logs "$pod" --all-containers=true --tail=150 || true
                echo "::endgroup::"
              done
      - name: make kind-down
        if: always()
        run: make kind-down
