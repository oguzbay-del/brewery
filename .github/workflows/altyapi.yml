name: altyapi

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "altyapi/**"
      - "sunucu/**"
      - "Makefile"
      - ".github/workflows/altyapi.yml"
  pull_request:
    paths:
      - "altyapi/**"
      - "sunucu/**"
      - "Makefile"
      - ".github/workflows/altyapi.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt ve validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Terraform version
        id: tf
        run: echo "version=$(tr -d '[:space:]' < altyapi/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: altyapi/terraform
      - name: init -backend=false ve validate (her env)
        working-directory: altyapi/terraform
        run: |
          set -euo pipefail
          for d in envs/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

  compose:
    name: compose config ve duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f altyapi/compose/compose.yaml config --quiet
      - name: make up
        run: make up
      - name: make smoke
        run: make smoke
      - name: Günlükler (başarısızlıkta)
        if: failure()
        run: docker compose -f altyapi/compose/compose.yaml logs --no-color --tail=200
      - name: make down
        if: always()
        run: make down ARGS=-v
