name: altyapi

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "altyapi/**"
      - "sunucu/**"
      - "Makefile"
      - ".github/workflows/altyapi.yml"
  pull_request:
    paths:
      - "altyapi/**"
      - "sunucu/**"
      - "Makefile"
      - ".github/workflows/altyapi.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt ve validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned Terraform version
        id: tf
        run: echo "version=$(tr -d '[:space:]' < altyapi/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: altyapi/terraform
      - name: init -backend=false ve validate (her env)
        working-directory: altyapi/terraform
        run: |
          set -euo pipefail
          for d in envs/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

  compose:
    name: compose config ve duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f altyapi/compose/compose.yaml config --quiet
      - name: make up
        run: make up
      - name: make smoke
        run: make smoke
      - name: Günlükler (başarısızlıkta)
        if: failure()
        run: docker compose -f altyapi/compose/compose.yaml logs --no-color --tail=200
      - name: make down
        if: always()
        run: make down ARGS=-v

  kubernetes:
    name: kustomize ve kind duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: kind 0.33.0
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - name: kustomize (base ve bütün overlay'ler)
        run: |
          set -euo pipefail
          for d in altyapi/k8s/base altyapi/k8s/overlays/*/; do
            echo "::group::$d"
            kubectl kustomize "$d" > /dev/null
            echo "::endgroup::"
          done
      - name: kind betikleri (sözdizimi)
        run: bash -n altyapi/k8s/kind-up.sh && bash -n altyapi/k8s/kind-test.sh && bash -n altyapi/k8s/kind-down.sh
      - name: Genel girişte /internal yok (edge yapılandırması)
        run: |
          set -euo pipefail
          kubectl kustomize altyapi/k8s/overlays/yerel | grep -q 'location ^~ /internal { return 404; }'
      - name: make kind-up
        run: make kind-up
      - name: make kind-test
        run: make kind-test
      - name: Küme durumu (başarısızlıkta)
        if: failure()
        run: |
          kubectl --context kind-demleme -n demleme get pods,jobs -o wide || true
          kubectl --context kind-demleme -n demleme describe pods | tail -n 200 || true
          kubectl --context kind-demleme -n istio-system get pods -o wide || true
          kubectl --context kind-demleme -n istio-system logs daemonset/ztunnel --tail=80 || true
          kubectl --context kind-demleme -n demleme logs deployment/oauth2-proxy --tail=40 || true
          kubectl --context kind-demleme -n demleme logs deployment/edge --tail=40 || true
      - name: make kind-down
        if: always()
        run: make kind-down
