name: Deploy marketing preview to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "marketing-site/**"
      - ".github/workflows/marketing-site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      GITHUB_PAGES: "true"
    defaults:
      run:
        working-directory: marketing-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Astro and TypeScript checks
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Validate generated routes, metadata and links
        run: npm run validate:site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
