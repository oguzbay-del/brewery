name: Marketing site checks

on:
  pull_request:
    paths:
      - "marketing-site/**"
      - ".github/workflows/marketing-site.yml"
  push:
    branches:
      - main
    paths:
      - "marketing-site/**"
      - ".github/workflows/marketing-site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Astro and TypeScript checks
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Validate generated routes, metadata and links
        run: npm run validate:site
      - name: Upload generated social preview for visual review
        uses: actions/upload-artifact@v7
        with:
          name: marketing-social-card-png
          path: marketing-site/dist/social-card.png
          if-no-files-found: error
          retention-days: 14
      - name: Install Chromium for responsive browser QA
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser QA
        run: npm run test:browser
      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketing-responsive-qa-screenshots
          path: marketing-site/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14
