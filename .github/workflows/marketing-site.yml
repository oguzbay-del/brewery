name: Marketing site checks

on:
  pull_request:
    paths:
      - "marketing-site/**"
      - ".github/workflows/marketing-site.yml"
  push:
    branches:
      - main
    paths:
      - "marketing-site/**"
      - ".github/workflows/marketing-site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Astro and TypeScript checks
        run: npm run check
      - name: Build static site
        run: npm run build
