name: ios

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "ios/**"
      - "tasarim-sistemi/tokens.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "tasarim-sistemi/tokens.json"
      - ".github/workflows/ios.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: xcodegen, validate, test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Token ve proje denetimi
        run: python3 -I ios/scripts/validate.py
      - name: Select Xcode 26 or later
        run: |
          set -euo pipefail
          # swift-openapi-generator and swift-openapi-runtime need Swift tools 6.2 (Xcode 26).
          xcode=""
          for d in /Applications/Xcode_2[6-9]*.app; do
            if [ -d "$d" ]; then xcode="$d"; fi
          done
          test -n "$xcode" || { echo "::error::no Xcode 26 or later on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: SwiftLint
        working-directory: ios
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          name=$(xcrun simctl list devices available iPhone | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | sed -E 's/ +$//' | grep -vE 'SE|Air' | sort -V | tail -n 1)
          test -n "$name"
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test
        working-directory: ios
        env:
          SIM_NAME: ${{ steps.sim.outputs.name }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Demleme.xcodeproj \
            -scheme Demleme \
            -skipPackagePluginValidation \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: iPad visual and accessibility tests (report mode)
        # Report mode (UIQ-11): a failure does not block. Screenshots are in the result bundle.
        continue-on-error: true
        working-directory: ios
        run: |
          set -uo pipefail
          for size in 11-inch 13-inch; do
            name=$(xcrun simctl list devices available "iPad Pro" | grep -oE "iPad Pro $size[^(]*\\([^)]*\\)" | sort -V | tail -n 1)
            [ -n "$name" ] || { echo "::warning::no iPad Pro $size simulator"; continue; }
            echo "Using simulator: $name"
            xcodebuild test \
              -project Demleme.xcodeproj \
              -scheme Demleme \
              -skipPackagePluginValidation \
              -only-testing:DemlemeUITests/IPadAdaptiveUITests \
              -only-testing:DemlemeUITests/IPadVisualUITests \
              -destination "platform=iOS Simulator,name=$name" \
              -resultBundlePath "ipad-$size.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO || echo "::warning::iPad tests failed on $name"
          done
      - name: Upload iPad result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-xcresult
          path: ios/ipad-*.xcresult
          if-no-files-found: ignore
