name: Agent bridge checks

on:
  pull_request:
    paths:
      - "agent-bridge/**"
      - "AGENT_TEAM.md"
      - ".github/workflows/agent-bridge-checks.yml"
      - ".github/scripts/**"
  push:
    branches:
      - main
    paths:
      - "agent-bridge/**"
      - "AGENT_TEAM.md"
      - ".github/workflows/agent-bridge-checks.yml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck, bundle, MCP e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-bridge
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-bridge/package-lock.json
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Type-check Worker
        run: npm run check
      - name: Bundle Worker (dry run)
        run: npx wrangler deploy --dry-run --outdir dist
      - name: MCP end-to-end test (2025 and 2026 protocol clients)
        run: npm run test:e2e
      - name: Runner integration test (Worker + mock GitHub/OpenAI + Claude CLI stub)
        run: npm run test:runners
      - name: Gate, review record and Pages check unit tests
        working-directory: .
        run: node --test .github/scripts/agent-auto-merge.test.mjs .github/scripts/pages-production-check.test.mjs
