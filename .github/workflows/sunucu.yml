name: sunucu

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "sunucu/**"
      - "formuller/testler/vektorler/**"
      - ".github/workflows/sunucu.yml"
  pull_request:
    paths:
      - "sunucu/**"
      - "formuller/testler/vektorler/**"
      - ".github/workflows/sunucu.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_CLI_VERSION: 0.9.0
  # Servis konteyneri (aşağıda) ile aynı; yalnız CI için örnek değer.
  DATABASE_URL: postgres://demleme:demleme-ci@localhost:5432/demleme

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: demleme
          POSTGRES_PASSWORD: demleme-ci
          POSTGRES_DB: demleme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demleme -d demleme"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: sunucu
    steps:
      - uses: actions/checkout@v6
      # rust-toolchain.toml (1.97.0, rustfmt, clippy) is the single source of the version.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sunucu
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # sqlx sorgu önbelleği (sunucu/.sqlx) güncel mi? Göçler önce veritabanına uygulanır.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked --version "$SQLX_CLI_VERSION" --no-default-features --features rustls,postgres
      - run: cargo run -p db --bin migrate
      - run: cargo sqlx prepare --workspace --check -- --all-targets
