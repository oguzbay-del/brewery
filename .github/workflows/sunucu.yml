name: sunucu

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "sunucu/**"
      - "formuller/testler/vektorler/**"
      - ".github/workflows/sunucu.yml"
  pull_request:
    paths:
      - "sunucu/**"
      - "formuller/testler/vektorler/**"
      - ".github/workflows/sunucu.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_CLI_VERSION: 0.9.0
  # Servis konteyneri (aşağıda) ile aynı; yalnız CI için örnek değer.
  DATABASE_URL: postgres://demleme:demleme-ci@localhost:5432/demleme
  REDIS_URL: redis://localhost:6379
  NATS_URL: nats://localhost:4222

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: demleme
          POSTGRES_PASSWORD: demleme-ci
          POSTGRES_DB: demleme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demleme -d demleme"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      # E-posta testleri (T2.11, T2.13): SMTP 1025, HTTP API 8025; compose ile aynı imaj.
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    defaults:
      run:
        working-directory: sunucu
    steps:
      - uses: actions/checkout@v6
      # JetStream için `-js` bayrağı gerekir; servis konteynerleri komut alamaz (T2.15).
      - name: NATS (JetStream)
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -sd /data -m 8222
          for _ in $(seq 1 30); do curl -fs http://localhost:8222/healthz && break; sleep 1; done
      # S3 uyumlu nesne deposu (T2.18 testleri; compose'taki objectstore ile aynı imaj ve kimlik).
      # Servis konteyneri komut satırı alamadığı için docker run ile açılır; testlerin varsayılan
      # S3_* değerleri bu adres ve anahtardır.
      - name: Start object store (SeaweedFS)
        working-directory: .
        run: |
          docker run -d --name objectstore -p 8333:8333 \
            -v "$PWD/altyapi/compose/s3/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.05 server -dir=/data -master.volumeSizeLimitMB=64 -volume.max=20 \
            -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
          for _ in $(seq 1 30); do
            docker exec objectstore wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && exit 0
            sleep 2
          done
          docker logs objectstore
          exit 1
      # rust-toolchain.toml (1.97.0, rustfmt, clippy) is the single source of the version.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sunucu
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # sqlx sorgu önbelleği (sunucu/.sqlx) güncel mi? Göçler önce veritabanına uygulanır.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked --version "$SQLX_CLI_VERSION" --no-default-features --features rustls,postgres
      - run: cargo run -p db --bin migrate
      - run: cargo sqlx prepare --workspace --check -- --all-targets
