name: belgeler

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "plan/**"
      - "arayuz/**"
      - "formuller/**"
      - "araclar/**"
      - "tasarim-sistemi/**"
      - "erisilebilirlik/**"
      - ".github/workflows/belgeler.yml"
  pull_request:
    paths:
      - "plan/**"
      - "arayuz/**"
      - "formuller/**"
      - "araclar/**"
      - "tasarim-sistemi/**"
      - "erisilebilirlik/**"
      - ".github/workflows/belgeler.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: tutarlılık ve formül testleri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # Vektörler Python 3.12+ ile üretilir (3.11'de sum() farklı; T1.12 P6).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Plan, konsept ve formül tutarlılığı
        run: python3 -I araclar/tutarlilik.py
      - name: Formül test vektörleri
        working-directory: formuller
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(testler/*.py)
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do
            echo "::group::$f"
            python3 -I "$f"
            echo "::endgroup::"
          done

      - name: Parite vektörleri güncel (ADR-0003)
        run: |
          python3 -I formuller/testler/parite/uret.py
          git diff --exit-code -- formuller/testler/vektorler
          test -z "$(git status --porcelain -- formuller/testler/vektorler)"
