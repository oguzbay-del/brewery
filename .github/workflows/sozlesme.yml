name: sozlesme

on:
  push:
    branches: [main, "is/**"]
    paths:
      - "sozlesme/**"
      - "sunucu/**"
      - ".github/workflows/sozlesme.yml"
  pull_request:
    paths:
      - "sozlesme/**"
      - "sunucu/**"
      - ".github/workflows/sozlesme.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    name: OpenAPI ve TS tipleri güncel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # breaking.sh compares openapi.json with origin/main
      - name: Install pinned toolchain
        working-directory: sunucu
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sunucu
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: sozlesme/istemci/typescript/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Install pinned oasdiff
        run: go install github.com/oasdiff/oasdiff@v1.37.0
      - run: bash sozlesme/scripts/check.sh
