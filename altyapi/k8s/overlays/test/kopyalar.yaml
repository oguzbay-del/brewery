apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
