# Canli: PostgreSQL ve Redis YOK; dış servisler (Cloud SQL, Memorystore) Secret ile bağlanır.
# Ön koşul: `demleme` ad alanında bulut tarafında (ör. Secret Manager) üretilmiş iki Secret olmalı;
# değerler depoya yazılmaz: `demleme-dis-servisler` (DATABASE_URL = app_api, WORKER_DATABASE_URL =
# app_worker, REDIS_URL) ve `demleme-migrate` (MIGRATE_DATABASE_URL = göç rolü, APP_API_PASSWORD,
# APP_WORKER_PASSWORD; yalnız göç Job'ı okur).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demleme
resources:
  - ../../base
# Etiketler CI'da gerçek sürümle değiştirilir (kustomize edit set image); burada yer tutucu.
# Kayıt defteri adresi doğrulanacak (ilk bulut: Google Cloud, Artifact Registry).
images:
  - { name: demleme/api, newName: KAYIT-DEFTERI/demleme/api, newTag: SURUM }
  - { name: demleme/engine-service, newName: KAYIT-DEFTERI/demleme/engine-service, newTag: SURUM }
  - { name: demleme/worker, newName: KAYIT-DEFTERI/demleme/worker, newTag: SURUM }
  - { name: demleme/ingest, newName: KAYIT-DEFTERI/demleme/ingest, newTag: SURUM }
  - { name: demleme/migrate, newName: KAYIT-DEFTERI/demleme/migrate, newTag: SURUM }
patches:
  - path: kopyalar.yaml
