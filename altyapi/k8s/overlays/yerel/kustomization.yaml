# Yerel (kind): PostgreSQL, Redis, nesne deposu ve sahte dış servisler küme içinde.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demleme
resources:
  - ../../base
  - veri.yaml
  - servisler.yaml
  - mesh.yaml
patches:
  - path: oauth2-proxy-yerel.yaml
  # Gateway Servisi ClusterIP olur (kind'da yük dengeleyici yok); konak adları yerel değer olur.
  - target: { kind: Gateway, name: kenar }
    patch: |-
      - { op: replace, path: /spec/listeners/1/hostname, value: internal.demleme.local }
  - target: { kind: ConfigMap, name: kenar-ayar }
    patch: |-
      - op: add
        path: /data/service
        value: |
          spec:
            type: ClusterIP
  - target: { kind: HTTPRoute, name: dahili }
    patch: |-
      - { op: replace, path: /spec/hostnames/0, value: internal.demleme.local }
  - target: { kind: HTTPRoute, name: uygulama }
    patch: |-
      - { op: replace, path: /spec/hostnames/0, value: app.demleme.local }
images:
  - { name: demleme/api, newTag: dev }
  - { name: demleme/engine-service, newTag: dev }
  - { name: demleme/worker, newTag: dev }
  - { name: demleme/ingest, newTag: dev }
  - { name: demleme/migrate, newTag: dev }
configMapGenerator:
  - name: demleme-config
    behavior: merge
    literals:
      - S3_ENDPOINT=http://objectstore:8333
      - S3_PUBLIC_ENDPOINT=http://127.0.0.1:8333
      - S3_CREATE_BUCKET=true
      - S3_DIGEST_BUCKET=
      - GITHUB_API_URL=http://github-mock:8080
      - APNS_URL=http://apns-mock:8080
      - APNS_TOPIC=com.demleme.app.dev
      - APPLE_BUNDLE_ID=com.demleme.app.dev
      - APPLE_ENVIRONMENT=Sandbox
# Yalnız yerel örnek değer (compose ile aynı); gerçek ortamlara girmez.
secretGenerator:
  - name: demleme-postgres
    literals:
      - POSTGRES_PASSWORD=demleme-yerel
  # Göç Job'ı: kurucu kullanıcı + uygulama rollerinin parolaları (yalnız migrate görür).
  - name: demleme-migrate
    literals:
      - MIGRATE_DATABASE_URL=postgres://demleme:demleme-yerel@postgres:5432/demleme
      - APP_API_PASSWORD=demleme-api-yerel
      - APP_WORKER_PASSWORD=demleme-worker-yerel
  # Sahte oauth2-proxy ayarları (gerçek OIDC istemcisi yok; bkz. oauth2-proxy-yerel.yaml).
  - name: demleme-oauth2-proxy
    literals:
      - OAUTH2_PROXY_CLIENT_ID=yerel-sahte
      - OAUTH2_PROXY_CLIENT_SECRET=yerel-sahte-gizli
      - OAUTH2_PROXY_COOKIE_SECRET=0123456789abcdef0123456789abcdef
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_REDIRECT_URL=http://internal.demleme.local/oauth2/callback
  - name: demleme-dis-servisler
    files:
      - s3.json=./s3.json
    literals:
      - DATABASE_URL=postgres://app_api:demleme-api-yerel@postgres:5432/demleme
      - WORKER_DATABASE_URL=postgres://app_worker:demleme-worker-yerel@postgres:5432/demleme
      - REDIS_URL=redis://redis:6379
      - S3_ACCESS_KEY=demleme-yerel
      - S3_SECRET_KEY=demleme-yerel-gizli
      - GITHUB_TOKEN=demleme-yerel
      - GITHUB_WEBHOOK_SECRET=demleme-yerel-webhook
      - INTERNAL_PROXY_TOKEN=demleme-yerel-internal
      - BREW_PACKAGE_KEY=demleme-yerel-brew-package-key
      - APNS_KEY_ID=LOCALKEY01
      - APNS_TEAM_ID=LOCALTEAM01
generatorOptions:
  disableNameSuffixHash: true
