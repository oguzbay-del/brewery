# Sahte servislere yalnız uygulama servisleri erişir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: objectstore-api-worker
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: objectstore }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker] }
      ports:
        - { protocol: TCP, port: 8333 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sahte-dis-servisler
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [mailpit, github-mock, apns-mock] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker, ingest] }
      ports:
        - { protocol: TCP, port: 1025 }
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fake-oidc-api-oauth2-proxy
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: fake-oidc }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, oauth2-proxy] }
      ports:
        - { protocol: TCP, port: 9000 }
