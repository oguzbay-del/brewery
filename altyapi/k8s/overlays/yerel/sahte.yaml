          imagePullPolicy: IfNotPresent
          args: ["--disable-banner", "--root-dir=/tmp/wm"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /__admin/health, port: http }
