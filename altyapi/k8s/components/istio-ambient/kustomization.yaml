# Servisler arası mTLS (ADR-0009 › 10): Istio ambient modu. Ön koşul: kümede Istio ambient kurulu
# (istiod, istio-cni, ztunnel; yerelde `make kind-up` kurar). Uygulama kodu mTLS bilmez.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - mesh.yaml
patches:
  - target: { kind: Namespace, name: demleme }
    patch: |-
      - op: add
        path: /metadata/labels/istio.io~1dataplane-mode
        value: ambient
