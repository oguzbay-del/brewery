# Veritabanı göçleri: tek seferlik Job (sunucu/migrations, `migrate` ikilisi). MIGRATE_DATABASE_URL
# ve uygulama rollerinin parolaları (APP_API_PASSWORD, APP_WORKER_PASSWORD) `demleme-migrate`
# Secret'ından gelir; servisler bu Secret'ı görmez. Tekrar çalışması güvenlidir (sqlx kilit alır).
# Servislerin göçten sonra başlaması şimdilik zorlanmıyor (servisler henüz veritabanı
# kullanmıyor); sıralama T2.10'da API veritabanına bağlanırken eklenir.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: demleme/migrate
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVICE_NAME, value: migrate }
          envFrom:
            - configMapRef: { name: demleme-config }
            - secretRef: { name: demleme-migrate }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
