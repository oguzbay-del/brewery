apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demleme
labels:
  - pairs: { app.kubernetes.io/part-of: demleme }
resources:
  - namespace.yaml
  - api.yaml
  - engine-service.yaml
  - worker.yaml
  - ingest.yaml
  - nats.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: demleme-config
    literals:
      - RUST_LOG=info
      - NATS_URL=nats://nats:4222
      - ENGINE_URL=http://engine-service:50051
generatorOptions:
  disableNameSuffixHash: true
