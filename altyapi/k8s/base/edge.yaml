# Genel giriş (edge): internetten gelen API trafiğini api'ye aktaran ters vekil.
# `/internal` (destek paneli, T2.30) genel girişten ASLA aktarılmaz: 404 döner. Panele yalnız
# oauth2-proxy üzerinden (oauth2-proxy.yaml) ulaşılır. Bu, ADR-0009 › 10'daki "internal yalnız
# OIDC ters vekilinden" kuralının birinci katmanıdır; ikincisi api'nin kendi belirteç denetimidir
# (X-Internal-Proxy-Token). Canlıda bu Service'in önüne bulutun yük dengeleyicisi gelir.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demleme-edge-nginx
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes auto;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server_tokens off;
      client_max_body_size 2m;
      server {
        listen 8080;
        # Genel girişte destek paneli yok.
        location ^~ /internal { return 404; }
        # Dışarıdan gelen vekil başlıkları atılır; yalnız oauth2-proxy bunları kurar.
        location / {
          proxy_set_header X-Internal-Proxy-Token "";
          proxy_set_header X-Auth-Request-Email "";
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_pass http://api:8080;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: edge }
  template:
    metadata:
      labels: { app.kubernetes.io/name: edge }
    spec:
      serviceAccountName: edge
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: edge
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: conf
          configMap: { name: demleme-edge-nginx }
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
spec:
  selector: { app.kubernetes.io/name: edge }
  ports:
    - { name: http, port: 8080, targetPort: http }
