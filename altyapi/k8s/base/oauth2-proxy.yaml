# OIDC ters vekil (oauth2-proxy) destek paneli (`/internal`, T2.30) için. Personel şirketin Google
# Workspace hesabıyla girer (geçiş anahtarı kimlik sağlayıcıda). Başarılı girişten sonra vekil
# api'ye `X-Auth-Request-Email` ve paylaşılan `X-Internal-Proxy-Token` başlıklarını ekler;
# api personeli e-postadan çözer. Vekilin ayarları `demleme-oauth2-proxy-ayar` ConfigMap'inden
# (ortama göre overlay verir), sırları `demleme-oauth2-proxy` Secret'ından gelir (istemci
# kimliği ve sırrı, çerez sırrı, INTERNAL_PROXY_TOKEN; depoda değer yoktur).
apiVersion: v1
kind: ConfigMap
metadata:
  name: demleme-oauth2-proxy-alpha
data:
  alpha.yaml: |
    upstreamConfig:
      upstreams:
        - id: api
          path: /
          uri: http://api:8080
    injectRequestHeaders:
      - name: X-Auth-Request-Email
        values:
          - claim: email
      - name: X-Internal-Proxy-Token
        values:
          - secretSource:
              fromEnv: INTERNAL_PROXY_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: oauth2-proxy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: oauth2-proxy }
    spec:
      serviceAccountName: oauth2-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
          imagePullPolicy: IfNotPresent
          args:
            - --alpha-config=/etc/oauth2-proxy/alpha.yaml
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --provider=oidc
            - --code-challenge-method=S256
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
          envFrom:
            - configMapRef: { name: demleme-oauth2-proxy-ayar }
            - secretRef: { name: demleme-oauth2-proxy }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: alpha, mountPath: /etc/oauth2-proxy, readOnly: true }
      volumes:
        - name: alpha
          configMap: { name: demleme-oauth2-proxy-alpha }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector: { app.kubernetes.io/name: oauth2-proxy }
  ports:
    - { name: http, port: 4180, targetPort: http }
