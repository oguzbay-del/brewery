# Varsayılan: namespace'teki bütün podlara giriş kapalı; gerekenler aşağıda açılır.
# (Çıkış kısıtlanmaz.) Politikayı uygulayan bir CNI gerekir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: varsayilan-giris-kapali
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Hesap motoruna yalnız api erişir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: engine-service-yalniz-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: engine-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: api }
      ports:
        - { protocol: TCP, port: 50051 }
---
# PostgreSQL'e api, worker, ingest ve tek seferlik migrate işi erişir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-uygulama-servisleri
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker, ingest, migrate] }
      ports:
        - { protocol: TCP, port: 5432 }
---
# Redis yalnız API tarafından kullanılır (REDIS_URL api yapılandırmasında).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-yalniz-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: api }
      ports:
        - { protocol: TCP, port: 6379 }
---
# api ve ingest dışarıdan (kenar katmanı / yük dengeleyici) gelen trafiği alır.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingest-giris
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [api, ingest] }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8082 }
---
# NATS istemci portu yalnız api, worker ve ingest tarafından kullanılır.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-uygulama-servisleri
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: nats }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker, ingest] }
      ports:
        - { protocol: TCP, port: 4222 }
---
# S3 nesne deposuna yalnız dosya uçlarını kullanan API ve dışa aktarma işçisi erişir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: objectstore-s3-uygulama-servisleri
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: objectstore }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, worker] }
      ports:
        - { protocol: TCP, port: 8333 }
