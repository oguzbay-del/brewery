# Yerel sistem: tüm servisler ve sahte dış servisler. Kullanım: kökte `make up`.
name: demleme

x-rust-service: &rust-service
  restart: unless-stopped
  environment: &rust-env
    RUST_LOG: info
    # Uygulama rolü (app_api); tablo sahibi ve süper kullanıcı değil, RLS altında (ADR-0007).
    DATABASE_URL: postgres://app_api:${APP_API_PASSWORD:-demleme-api-yerel}@postgres:5432/${POSTGRES_DB:-demleme}
    REDIS_URL: redis://redis:6379
    NATS_URL: nats://nats:4222
    ENGINE_URL: http://engine-service:50051
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    GITHUB_API_URL: http://github-mock:8080
    APNS_URL: http://apns-mock:8080
    S3_ENDPOINT: http://objectstore:8333
    S3_BUCKET: demleme-files
    S3_REGION: us-east-1
    S3_ACCESS_KEY: demleme-yerel
    S3_SECRET_KEY: demleme-yerel-gizli
    S3_CREATE_BUCKET: "true"
    # Tarayıcı ve istemcinin eriştiği adres (imzalı bağlantılar bu adrese verilir).
    S3_PUBLIC_ENDPOINT: http://127.0.0.1:${S3_PORT:-8333}
  depends_on: &rust-deps
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    nats: { condition: service_healthy }
    objectstore: { condition: service_healthy }

x-http-health: &http-health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demleme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demleme-yerel}
      POSTGRES_DB: ${POSTGRES_DB:-demleme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  github-mock:
    image: wiremock/wiremock:3.13.2
    restart: unless-stopped
    command: ["--disable-banner"]
    volumes:
      - ./mocks/github/mappings:/home/wiremock/mappings:ro
    ports:
      - "127.0.0.1:${GITHUB_MOCK_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  apns-mock:
    image: wiremock/wiremock:3.13.2
    restart: unless-stopped
    command: ["--disable-banner"]
    volumes:
      - ./mocks/apns/mappings:/home/wiremock/mappings:ro
    ports:
      - "127.0.0.1:${APNS_MOCK_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # S3 uyumlu yerel nesne deposu (ADR-0008 kural 11.1, T2.18). MinIO topluluk sürümü bakım
  # modunda ve AGPL; SeaweedFS Apache 2.0. Üretimde S3, GCS (S3 birlikte çalışabilirliği) ya da
  # başka S3 uyumlu depo; kod yalnız `ObjectStore` arayüzüne bağlıdır. Kova API açılışında
  # (S3_CREATE_BUCKET=true) oluşturulur.
  objectstore:
    image: chrislusf/seaweedfs:4.05
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=64
      - -volume.max=20
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -ip.bind=0.0.0.0
    volumes:
      - objectdata:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      <<: *http-health

  # Tek seferlik göç (sunucu/migrations); api, worker ve ingest bitmesini bekler. Göç rolü
  # PostgreSQL'in kurucu kullanıcısıdır; göçten sonra app_api ve app_worker'a parolalarını verir.
  migrate:
    build:
      context: ../../sunucu
      additional_contexts:
        proto: ../../sozlesme/proto
      secrets: [build_ca]
      args:
        BIN: migrate
    image: demleme/migrate:dev
    restart: "no"
    environment:
      RUST_LOG: info
      MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER:-demleme}:${POSTGRES_PASSWORD:-demleme-yerel}@postgres:5432/${POSTGRES_DB:-demleme}
      APP_API_PASSWORD: ${APP_API_PASSWORD:-demleme-api-yerel}
      APP_WORKER_PASSWORD: ${APP_WORKER_PASSWORD:-demleme-worker-yerel}
    depends_on:
      postgres: { condition: service_healthy }

  engine-service:
    <<: *rust-service
    build:
      context: ../../sunucu
      additional_contexts:
        proto: ../../sozlesme/proto
      secrets: [build_ca]
      args:
        BIN: engine-service
    image: demleme/engine-service:dev
    environment:
      <<: *rust-env
      PORT: "50051"
      SERVICE_NAME: engine-service
    ports:
      - "127.0.0.1:${ENGINE_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:50051"]
      <<: *http-health

  api:
    <<: *rust-service
    build:
      context: ../../sunucu
      additional_contexts:
        proto: ../../sozlesme/proto
      secrets: [build_ca]
      args:
        BIN: api
    image: demleme/api:dev
    environment:
      <<: *rust-env
      PORT: "8080"
      SERVICE_NAME: api
      # Giriş (ADR-0009): Apple ve Google yerelde sahte OIDC sağlayıcısından doğrulanır.
      APPLE_CLIENT_IDS: com.demleme.app.dev
      APPLE_ISSUER: http://fake-oidc:9000/apple
      APPLE_JWKS_URL: http://fake-oidc:9000/apple/jwks
      GOOGLE_CLIENT_IDS: demleme-dev.apps.googleusercontent.example
      GOOGLE_ISSUER: http://fake-oidc:9000/google
      GOOGLE_JWKS_URL: http://fake-oidc:9000/google/jwks
      WEB_BASE_URL: http://localhost:3000
      MAIL_FROM: no-reply@demleme.local
      # Yalnız yerel geliştirme değeri; kümede sır yöneticisinden gelir (CSRF_HMAC_KEY_FILE).
      CSRF_HMAC_KEY: ${CSRF_HMAC_KEY:-demleme-yerel-csrf-anahtari}
    depends_on:
      <<: *rust-deps
      engine-service: { condition: service_healthy }
      fake-oidc: { condition: service_healthy }
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: &healthz-probe ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${PORT}; printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3; head -n1 <&3 | grep -q ' 200 '"]
      <<: *http-health

  # Sahte Apple ve Google OIDC sağlayıcısı (JWKS ve belirteç üretimi); yalnız yerel ve testler için.
  # Belirteç üretmek: POST http://127.0.0.1:9000/{apple|google}/mint (sunucu/crates/fake-oidc).
  fake-oidc:
    restart: unless-stopped
    build:
      context: ../../sunucu
      additional_contexts:
        proto: ../../sozlesme/proto
      secrets: [build_ca]
      args:
        BIN: fake-oidc
    image: demleme/fake-oidc:dev
    environment:
      RUST_LOG: info
      PORT: "9000"
      PUBLIC_URL: http://fake-oidc:9000
    ports:
      - "127.0.0.1:${FAKE_OIDC_PORT:-9000}:9000"
    healthcheck:
      test: *healthz-probe
      <<: *http-health

  worker:
    <<: *rust-service
    build:
      context: ../../sunucu
      additional_contexts:
        proto: ../../sozlesme/proto
      secrets: [build_ca]
      args:
        BIN: worker
    image: demleme/worker:dev
    environment:
      <<: *rust-env
      DATABASE_URL: postgres://app_worker:${APP_WORKER_PASSWORD:-demleme-worker-yerel}@postgres:5432/${POSTGRES_DB:-demleme}
      PORT: "8081"
      SERVICE_NAME: worker
    depends_on:
      <<: *rust-deps
      engine-service: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WORKER_PORT:-8081}:8081"
    healthcheck:
      test: *healthz-probe
      <<: *http-health

  ingest:
    <<: *rust-service
    build:
      context: ../../sunucu
      additional_contexts:
        proto: ../../sozlesme/proto
      secrets: [build_ca]
      args:
        BIN: ingest
    image: demleme/ingest:dev
    environment:
      <<: *rust-env
      PORT: "8082"
      SERVICE_NAME: ingest
    ports:
      - "127.0.0.1:${INGEST_PORT:-8082}:8082"
    healthcheck:
      test: *healthz-probe
      <<: *http-health

secrets:
  # Yalnız TLS'i araya giren bir proxy arkasında derlerken dolu olur. Makefile bu
  # dosyayı her `make up`ta üretir (BUILD_CA_FILE verilirse içine kopyalar, yoksa
  # boş bırakır); boşsa varsayılan güven deposu kullanılır.
  build_ca:
    file: ./.build-ca.pem

volumes:
  pgdata:
  natsdata:
  objectdata:
